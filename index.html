<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="小学生向けWeb教材にも使える、Web Audio APIの音レシピ集。聞いて、比べて、コードをコピーできます。">
  <title>SOUND RECIPE｜音のレシピ集</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <div class="eyebrow"><span class="pulse-dot"></span> WEB AUDIO LAB</div>
    <h1>SOUND <em>RECIPE</em></h1>
    <p class="lead">聞いて、比べて、すぐ使える。<br>Web教材のための効果音レシピ集。</p>
    <div class="hero-actions"><button class="primary-btn" id="playAll" type="button">▶ ぜんぶ試聴</button><span class="hint">音が出ます。端末の音量に注意してください。</span></div>
  </div><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div></header>
  <main>
    <section class="toolbar" aria-label="音を探す"><div class="toolbar-top"><div><p class="section-kicker">RECIPE BOOK</p><h2>音をえらぶ</h2></div><span class="count" id="resultCount"></span></div>
      <div class="controls"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="音の名前や用途で検索" autocomplete="off"></label><div class="filters" id="filters" role="tablist" aria-label="カテゴリ"></div><label class="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="70"><output id="volumeValue">70%</output></label></div>
    </section>
    <section class="catalog" id="catalog" aria-live="polite"></section>
    <div class="empty hidden" id="empty"><div>🔎</div><h2>見つかりませんでした</h2><p>検索語やカテゴリを変えてみてください。</p></div>
    <section class="howto"><div><p class="section-kicker">HOW TO USE</p><h2>使い方はかんたん</h2></div><div class="steps"><div><b>01</b><span>聞く</span><small>▶ 再生で音を確認</small></div><div><b>02</b><span>選ぶ</span><small>用途に合うレシピを発見</small></div><div><b>03</b><span>使う</span><small>コードをコピーして貼り付け</small></div></div></section>
  </main>
  <footer><span>sounds.js</span> にレシピを追加すると、カードが自動で増えます。</footer><div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body></html>
